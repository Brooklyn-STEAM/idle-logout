name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build --release

      - name: Publish release for the pushed tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/idle-logout.exe \
            --title "$GITHUB_REF_NAME" --latest --generate-notes
