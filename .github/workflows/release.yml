name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc

      - name: Build installer
        shell: bash
        run: |
          cp target/x86_64-pc-windows-msvc/release/idle-logout.exe idle-logout-x64.exe
          cp target/aarch64-pc-windows-msvc/release/idle-logout.exe idle-logout-arm64.exe
          # Inno Setup is preinstalled on the runner. MSYS_NO_PATHCONV stops Git Bash rewriting /D... into a file path.
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$(cargo pkgid | sed 's/.*[#@]//')" installer.iss

      - name: Publish release for the pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" idle-logout-setup.exe idle-logout-x64.exe idle-logout-arm64.exe \
            --title "$GITHUB_REF_NAME" --latest --generate-notes
